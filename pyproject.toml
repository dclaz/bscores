[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bscores"
version = "0.2.0"
description = "B-scores: rating and forecasting pairwise contests via eigenvector centrality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "David Lazaridis", email = "davidlaz@gmail.com" }]
keywords = ["rating", "elo", "sports", "network", "eigenvector-centrality", "forecasting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
sparse = ["scipy>=1.7"]
plot = ["matplotlib>=3.5"]
all = ["pandas>=1.3", "scipy>=1.7", "matplotlib>=3.5"]
test = ["pytest>=7", "pandas>=1.3", "scipy>=1.7", "matplotlib>=3.5"]
dev = [
    "pytest>=7",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "ruff>=0.4",
    "openpyxl>=3.0",
]

[project.urls]
Homepage = "https://github.com/dclaz/bscores"
Source = "https://github.com/dclaz/bscores"
Paper = "https://doi.org/10.1007/s10479-022-04594-7"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bscores = ["py.typed"]
"bscores.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--doctest-modules"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B905"]
